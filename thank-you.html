<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Thank You | MASMOD Hunt</title>

    <link rel="stylesheet" href="CSS/global.css">
    <link rel="stylesheet" href="CSS/thank-you.css">
</head>

<body>

    <main class="thankyou-page">

        <!-- Logo -->
        <header class="thankyou-logo">

            <span>MASMOD</span>
            <strong>HUNT</strong>

        </header>


        <!-- Mascot -->
        <section class="mascot-section">

            <div class="mascot-decoration decoration-one"></div>
            <div class="mascot-decoration decoration-two"></div>
            <div class="mascot-decoration decoration-three"></div>

            <img
                src="assets/images/thankyou-mascot.png"
                alt="MASMOD Hunt Thank You Mascot"
                class="thankyou-mascot"
            >

        </section>


        <!-- Message -->
        <section class="thankyou-message">

            <h1>
                THANK YOU
                <span>FOR PLAYING!</span>
            </h1>

            <p>
                Keep learning. Keep protecting.
            </p>

        </section>


        <!-- Back Home -->
        <button
            type="button"
            id="homeButton"
            class="home-button">

            Back to Home

            <span>⌂</span>

        </button>


        <!-- Footer -->
        <footer class="thankyou-footer">

            <p>
                DIFFERENT MINDS.
                <br>
                A SAFER WORLD.
            </p>

        </footer>

    </main>


    <script src="js/thank-you.js"></script>

</body>

</html>
