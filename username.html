<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Pick a Nickname | MASMOD Hunt</title>


    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Original+Surfer&display=swap"
        rel="stylesheet"
    >


    <!-- Global CSS -->
    <link rel="stylesheet" href="CSS/global.css">

    <!-- Username Page CSS -->
    <link rel="stylesheet" href="CSS/username.css">
</head>

<body>

    <main class="nickname-page">

        <!-- Back Button -->
        <a href="index.html"
           class="back-button"
           aria-label="Back to Home">
            ‹
        </a>


        <!-- Game Logo -->
        <header class="game-logo">
            <span class="logo-masmod">MASMOD</span>
            <span class="logo-hunt">HUNT</span>
        </header>


        <!-- Page Title -->
        <section class="nickname-header">

            <h1>
    Pick a
    <span class="nickname-highlight">Nickname</span>
</h1>

            <p>Make it fun!</p>

        </section>


        <!-- Nickname Form -->
        <section class="nickname-form">

            <input
                type="text"
                id="nicknameInput"
                maxlength="18"
                placeholder="e.g. LinuxNinja"
                autocomplete="off"
            >

            <p id="nicknameError"
               class="error-message">
                Please choose a nickname.
            </p>

        </section>


        <!-- Avatar Selection -->
        <section class="avatar-section">

            <div class="avatar-title-row">

                <h2>Choose Your Avatar</h2>

           
            </div>


            <div class="avatar-options">

                <button
                    type="button"
                    class="avatar-option selected"
                    data-avatar="avatar-1.png"
                    aria-label="Choose avatar 1">

                    <img
                        src="assets/images/avatars/avatar-1.png"
                        alt="Penguin Avatar 1"
                    >

                </button>


                <button
                    type="button"
                    class="avatar-option"
                    data-avatar="avatar-2.png"
                    aria-label="Choose avatar 2">

                    <img
                        src="assets/images/avatars/avatar-2.png"
                        alt="Penguin Avatar 2"
                    >

                </button>


                <button
                    type="button"
                    class="avatar-option"
                    data-avatar="avatar-3.png"
                    aria-label="Choose avatar 3">

                    <img
                        src="assets/images/avatars/avatar-3.png"
                        alt="Penguin Avatar 3"
                    >

                </button>


                <button
                    type="button"
                    class="avatar-option"
                    data-avatar="avatar-4.png"
                    aria-label="Choose avatar 4">

                    <img
                        src="assets/images/avatars/avatar-4.png"
                        alt="Penguin Avatar 4"
                    >

                </button>


                <button
                    type="button"
                    class="avatar-option"
                    data-avatar="avatar-5.png"
                    aria-label="Choose avatar 5">

                    <img
                        src="assets/images/avatars/avatar-5.png"
                        alt="Penguin Avatar 5"
                    >

                </button>


                <button
                    type="button"
                    class="avatar-option"
                    data-avatar="avatar-6.png"
                    aria-label="Choose avatar 6">

                    <img
                        src="assets/images/avatars/avatar-6.png"
                        alt="Penguin Avatar 6"
                    >

                </button>

            </div>

        </section>


        <!-- Mascot -->
        <section class="mascot-area">

            <img
                src="assets/images/nickname-mascot.png"
                alt="MASMOD Hunt Mascot"
                class="nickname-mascot"
            >

        </section>


        <!-- Next Button -->
        <button
            type="button"
            id="nextButton"
            class="next-button">

            Start the Hunt

            <span>→</span>

        </button>

    </main>


    <script src="js/username.js"></script>

</body>

</html>
