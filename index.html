
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MASMOD Hunt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Original+Surfer&display=swap"
    rel="stylesheet"
>
    <!-- CSS shared by all pages -->
    <link rel="stylesheet" href="css/global.css">

    <!-- CSS only for Home page -->
    <link rel="stylesheet" href="css/home.css">
</head>

<body>

    <main class="home-page">

        <!-- MASMOD Logo -->
        <header class="home-header">
<img
    src="assets/images/logo.jpg"
    alt="MASMOD Logo"
    class="company-logo"
>
        </header>


        <!-- Game Name -->
        <section class="game-title">

            <h1>
                <span class="masmod-text">MASMOD</span>
                <span class="hunt-text">HUNT</span>
            </h1>

            <p class="tagline">
                Think. Hunt. Win.
            </p>

        </section>


        <!-- Mascot -->
        

            <img
    src="assets/images/mascot.png"
    alt="MASMOD Hunt Mascot"
    class="mascot"
>

        </section>


        <!-- Start Button -->
        <section class="home-actions">

            <a
                href="username.html"
                class="primary-button"
            >
                Start the Hunt
                <span>→</span>
            </a>

        </section>


        <!-- Bottom Text -->
        
    </main>

</body>

</html>
