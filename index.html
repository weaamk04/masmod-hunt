<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MASMOD Hunt</title>

    <!-- CSS shared by all pages -->
    <link rel="stylesheet" href="css/global.css">

    <!-- CSS only for Home page -->
    <link rel="stylesheet" href="css/home.css">
</head>

<body>

    <main class="home-page">

        <!-- MASMOD Logo -->
        <header class="home-header">
            <img
    src="assets/images/masmod-logo.png"
    alt="MASMOD Logo"
    class="company-logo"
>
        </header>


        <!-- Game Name -->
        <section class="game-title">

            <h1>
                <span class="masmod-text">MASMOD</span>
                <span class="hunt-text">HUNT</span>
            </h1>

            <p class="tagline">
                Think. Hunt. Win.
            </p>

        </section>


        <!-- Mascot -->
        <section class="mascot-section">

            <span class="floating-word think">
                THINK
            </span>

            <span class="floating-word defend">
                DEFEND
            </span>

            <span class="floating-word spot">
                SPOT
            </span>

            <span class="floating-word win">
                WIN
            </span>

            <img
    src="assets/images/mascot.png"
    alt="MASMOD Hunt Mascot"
    class="mascot"
>

        </section>


        <!-- Start Button -->
        <section class="home-actions">

            <a
                href="username.html"
                class="primary-button"
            >
                Start the Hunt
                <span>→</span>
            </a>

        </section>


        <!-- Bottom Text -->
        <footer class="home-footer">

            <p>
                A SAFER DIGITAL TOMORROW
                <br>
                STARTS WITH YOU
            </p>

        </footer>

    </main>

</body>

</html>
