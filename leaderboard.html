<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Leaderboard | MASMOD Hunt</title>

    <link rel="stylesheet" href="CSS/global.css">
    <link rel="stylesheet" href="CSS/leaderboard.css">
</head>

<body>

    <main class="leaderboard-page">

        <!-- Top -->
        <header class="leaderboard-header">

            <div class="game-logo">
                <span>MASMOD</span>
                <strong>HUNT</strong>
            </div>

            <h1>Live Leaderboard</h1>

        </header>


        <!-- Players -->
        <section
            class="leaderboard-list"
            id="leaderboardList">
        </section>


        <!-- Button -->
        <a
        href="thank-you.html"
        class="result-button">
        Finish
        <span>→</span>
    </a>

        <!-- Footer -->
        <footer class="leaderboard-footer">

            <p>
                DIFFERENT MINDS.<br>
                A SAFER WORLD.
            </p>

        </footer>

    </main>


    <script src="js/leaderboard.js"></script>

</body>

</html>
